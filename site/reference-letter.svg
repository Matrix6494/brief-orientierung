<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="840" height="1188">
  <rect width="210" height="297" fill="#f4f0e8"/>
  <rect x="6" y="6" width="198" height="285" fill="#fffef9" stroke="#2a231c" stroke-width="0.7"/>

  <!-- 1 Sender: upper fifth, left to middle -->
  <rect x="10" y="10" width="96" height="48" fill="#e8f0ee" stroke="#245656" stroke-width="0.45"/>
  <text x="14" y="20" font-family="system-ui, sans-serif" font-size="3.1" fill="#5c4f42">Absender der Änderung</text>
  <text x="14" y="30" font-family="Georgia, serif" font-size="4.6" fill="#245656" font-weight="700">Muster Immobilien AG</text>
  <text x="14" y="38" font-family="system-ui, sans-serif" font-size="3.2" fill="#3d3429">Pilatusstrasse 1</text>
  <text x="14" y="45" font-family="system-ui, sans-serif" font-size="3.2" fill="#3d3429">6003 Luzern</text>
  <text x="14" y="53" font-family="system-ui, sans-serif" font-size="3.1" fill="#3d3429">12. März 2026</text>

  <text x="114" y="20" font-family="system-ui, sans-serif" font-size="3.1" fill="#5c4f42">An die Mieterin / den Mieter</text>
  <text x="114" y="30" font-family="system-ui, sans-serif" font-size="3.6" fill="#2a231c">A. Muster</text>
  <text x="114" y="38" font-family="system-ui, sans-serif" font-size="3.2" fill="#3d3429">Wohnstrasse 12</text>
  <text x="114" y="45" font-family="system-ui, sans-serif" font-size="3.2" fill="#3d3429">6003 Luzern</text>

  <!-- 2 Official form title -->
  <rect x="10" y="64" width="190" height="22" fill="#fdecea" stroke="#a93226" stroke-width="0.5"/>
  <text x="105" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="5.6" fill="#a93226" font-weight="700">Mitteilung von Mietzinserhöhungen</text>
  <text x="105" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="3" fill="#3d3429">Amtliches Formular · Kanton Luzern · Art. 269d OR</text>

  <text x="12" y="94" font-family="system-ui, sans-serif" font-size="3.1" fill="#5c4f42">Mietobjekt: 3.5 Zimmer, 2. OG, Wohnstrasse 12, 6003 Luzern</text>

  <!-- 3 Old and new rent -->
  <rect x="10" y="100" width="190" height="46" fill="#fff" stroke="#3d3429" stroke-width="0.5"/>
  <text x="14" y="110" font-family="system-ui, sans-serif" font-size="3.8" fill="#245656" font-weight="700">Bisheriger und neuer Mietzins</text>
  <rect x="14" y="114" width="88" height="26" fill="#f3efe8"/>
  <rect x="108" y="114" width="86" height="26" fill="#e8f0ee" stroke="#245656" stroke-width="0.35"/>
  <text x="18" y="123" font-family="system-ui, sans-serif" font-size="3" fill="#5c4f42">Bisher</text>
  <text x="18" y="132" font-family="system-ui, sans-serif" font-size="4.2" fill="#2a231c">CHF 1'450.00</text>
  <text x="18" y="138" font-family="system-ui, sans-serif" font-size="2.8" fill="#5c4f42">Nebenkosten CHF 180.00</text>
  <text x="112" y="123" font-family="system-ui, sans-serif" font-size="3" fill="#245656">Neu</text>
  <text x="112" y="132" font-family="system-ui, sans-serif" font-size="4.2" fill="#245656" font-weight="700">CHF 1'580.00</text>
  <text x="112" y="138" font-family="system-ui, sans-serif" font-size="2.8" fill="#245656">Nebenkosten CHF 195.00</text>

  <!-- 4 Effective from -->
  <rect x="10" y="150" width="190" height="22" fill="#fff" stroke="#3d3429" stroke-width="0.5"/>
  <text x="14" y="160" font-family="system-ui, sans-serif" font-size="3.8" fill="#245656" font-weight="700">Gültig ab</text>
  <text x="14" y="168" font-family="system-ui, sans-serif" font-size="3.3" fill="#2a231c">1. Juli 2026 (nächster Kündigungstermin)</text>

  <!-- 5 Reasons -->
  <rect x="10" y="176" width="190" height="50" fill="#fff" stroke="#3d3429" stroke-width="0.5"/>
  <text x="14" y="186" font-family="system-ui, sans-serif" font-size="3.8" fill="#245656" font-weight="700">Begründung</text>
  <text x="14" y="195" font-family="system-ui, sans-serif" font-size="3.1" fill="#3d3429">1. Anpassung Referenzzinssatz · CHF 80.00</text>
  <text x="14" y="202" font-family="system-ui, sans-serif" font-size="3.1" fill="#3d3429">2. Teuerung · CHF 35.00</text>
  <text x="14" y="209" font-family="system-ui, sans-serif" font-size="3.1" fill="#3d3429">3. Allgemeine Kostensteigerung · CHF 15.00</text>
  <text x="14" y="220" font-family="system-ui, sans-serif" font-size="3" fill="#5c4f42">Summe der Erhöhung CHF 130.00 / Monat</text>

  <!-- 6 Right to contest -->
  <rect x="10" y="230" width="190" height="34" fill="#fdecea" stroke="#a93226" stroke-width="0.45"/>
  <text x="14" y="240" font-family="system-ui, sans-serif" font-size="3.8" fill="#a93226" font-weight="700">Anfechtung innert 30 Tagen</text>
  <text x="14" y="248" font-family="system-ui, sans-serif" font-size="3" fill="#3d3429">Schlichtungsbehörde Miete und Pacht</text>
  <text x="14" y="255" font-family="system-ui, sans-serif" font-size="3" fill="#3d3429">Murbacherstrasse 31, 6002 Luzern · kostenlos</text>

  <!-- 7 Signature -->
  <rect x="10" y="268" width="104" height="18" fill="#fff" stroke="#3d3429" stroke-width="0.4"/>
  <text x="14" y="276" font-family="system-ui, sans-serif" font-size="2.9" fill="#5c4f42">Unterschrift Vermieter / Verwaltung</text>
  <path d="M16 282 c14 -5 30 4 44 -2" fill="none" stroke="#2a231c" stroke-width="0.7"/>
  <text x="122" y="276" font-family="system-ui, sans-serif" font-size="2.9" fill="#5c4f42">Ort / Datum</text>
  <text x="122" y="283" font-family="system-ui, sans-serif" font-size="3.1" fill="#2a231c">Luzern, 12.03.2026</text>
</svg>
